<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fusion Visual Lab · Spell Foundry</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.45 system-ui, sans-serif;
      background: #10191b;
      color: #eff0d6;
      accent-color: #e4b659;
    }
    * { box-sizing: border-box; }
    body { margin: 0 auto; max-width: 100rem; padding: 1.5rem clamp(1rem, 3vw, 3rem); }
    header { border-bottom: 1px solid #536454; padding-bottom: 1rem; }
    h1 { font: 700 2rem/1.1 Georgia, serif; margin: 0 0 .35rem; }
    p { color: #bbcaaf; margin: 0; }
    form { display: flex; flex-wrap: wrap; align-items: end; gap: .65rem 1rem; margin: 1rem 0; }
    label { font-size: .875rem; }
    label:has(select) { display: grid; gap: .25rem; }
    label:has(input) { display: inline-flex; align-items: center; gap: .25rem; min-height: 2.5rem; }
    input { width: 1rem; height: 1rem; }
    select {
      min-height: 2.5rem;
      padding: .25rem .5rem;
      font: inherit;
      background: #203033;
      border: 1px solid #718063;
      border-radius: 4px;
      color: inherit;
    }
    select:disabled { opacity: .55; }
    :focus-visible { outline: 2px solid #f5db87; outline-offset: 3px; }
    output { display: block; color: #bbcaaf; margin-bottom: 1rem; }
    #comparisons { display: grid; align-items: start; gap: 1rem; }
    #comparisons.single { grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--card-width)), 1fr)); }
    article { background: #172326; border: 1px solid #3b4b46; border-top: 3px solid var(--element); border-radius: 6px; min-width: 0; }
    .palette { padding: .65rem .75rem; }
    h2 { font-size: 1.125rem; margin: 0 0 .45rem; }
    dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); gap: .35rem; margin: 0; }
    dl div { display: grid; grid-template-columns: .7rem auto; column-gap: .3rem; align-items: center; }
    dt { font-size: .7rem; color: #bbcaaf; }
    dd { grid-column: 2; margin: 0; font: .75rem/1.3 ui-monospace, monospace; }
    .swatch { grid-row: span 2; height: 1.5rem; background: var(--swatch); border: 1px solid #ffffff29; }
    .samples { display: flex; flex-wrap: wrap; padding: .4rem .75rem .75rem; gap: .75rem; }
    figure { width: min(100%, calc(var(--pair-width) + 2px)); margin: 0; }
    figcaption { margin-bottom: .25rem; font-size: .85rem; font-weight: 600; }
    .viewport { overflow-x: auto; border: 1px solid #3b4b46; border-radius: 3px; }
    .pair { width: var(--pair-width); }
    .versions { display: grid; grid-template-columns: repeat(2, 1fr); background: #203033; }
    .versions span { text-align: center; font-size: .75rem; padding: .15rem; }
    .versions span + span { border-left: 1px solid #536454; }
    canvas { display: block; width: 100%; image-rendering: pixelated; }
  </style>
</head>
<body>
  <header>
    <h1>Fusion Visual Lab</h1>
    <p>Spell Foundry summon palette comparison</p>
  </header>
  <form id="controls">
    <label>View
      <select name="view">
        <option value="single">Single species</option>
        <option value="priority">Multi-species · priority eight</option>
        <option value="matrix">Complete matrix · 27 species</option>
      </select>
    </label>
    <label>Species <select name="species"></select></label>
    <label>Summon
      <select name="size"><option>Normal</option><option>Grand</option></select>
    </label>
    <label>Zoom
      <select name="zoom"><option value="1">Native · 1×</option><option value="2">Pixel-perfect · 2×</option><option value="3">Pixel-perfect · 3×</option></select>
    </label>
    <label><input type="checkbox" name="aura" checked> Aura &amp; particles</label>
    <label><input type="checkbox" name="marks" checked> Marks</label>
    <label><input type="checkbox" name="battlefield" checked> Battlefield</label>
  </form>
  <output id="status" aria-live="polite">Loading summon previews…</output>
  <main id="comparisons" aria-label="Fusion comparisons"></main>
  <script type="module">
    import { Battlefield } from '../src/render.js';
    import { SUMMON_ART } from '../src/summon-art.js';
    import { FUSION_SUMMON_PALETTES } from '../src/summon-palettes.js';

    const priority = ['golem', 'dragon', 'phoenix', 'wolf', 'skeleton', 'spider', 'sprite', 'slime'];
    const species = [...priority, ...Object.keys(SUMMON_ART).filter(id => !priority.includes(id)).sort()];
    const title = id => id[0].toUpperCase() + id.slice(1);
    const form = document.querySelector('#controls');
    const controls = form.elements;
    for (const id of species) controls.species.add(new Option(title(id), id));

    const stage = document.createElement('canvas');
    stage.width = 320;
    stage.height = 180;
    const renderer = new Battlefield(stage, { reducedMotion: false });
    cancelAnimationFrame(renderer.raf);

    const comparisons = document.querySelector('#comparisons');
    const status = document.querySelector('#status');
    // Crop around the summon at its actual battlefield position and native scale.
    const sampleWidth = 112;
    const sampleLeft = 88 - sampleWidth / 2;
    const pairWidth = sampleWidth * 2;
    const palettes = Object.entries(FUSION_SUMMON_PALETTES);

    function element(tag, content, className) {
      const node = document.createElement(tag);
      if (content) node.textContent = content;
      if (className) node.className = className;
      return node;
    }

    function swatches(palette) {
      const list = element('dl');
      const roles = {
        Shadow: palette.shadow, Midtone: palette.midtone, Highlight: palette.highlight,
        Spark: palette.spark, Core: palette.core, 'Mark #': palette.markColors['#'],
        'Mark +': palette.markColors['+'], Aura: palette.aura, Rim: palette.rim,
      };
      for (const [role, color] of Object.entries(roles)) {
        const entry = element('div');
        const chip = element('span', null, 'swatch');
        chip.style.setProperty('--swatch', color);
        entry.append(chip, element('dt', role), element('dd', color));
        list.append(entry);
      }
      return list;
    }

    function sample(id, fusion, options) {
      const figure = element('figure');
      figure.append(element('figcaption', title(id)));
      const viewport = element('div', null, 'viewport');
      const pair = element('div', null, 'pair');
      const labels = element('div', null, 'versions');
      labels.append(element('span', 'V1'), element('span', 'V2'));
      const canvas = element('canvas');
      const sampleTop = options.size === 'Grand' ? 44 : 92;
      const sampleHeight = 158 - sampleTop;
      canvas.width = pairWidth;
      canvas.height = sampleHeight;
      canvas.setAttribute('role', 'img');
      canvas.setAttribute('aria-label', `${options.size} ${title(fusion)} ${title(id)}, V1 left and V2 right`);
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = false;
      renderer.ctx.imageSmoothingEnabled = false;
      for (const [column, v2] of [false, true].entries()) {
        if (options.battlefield) renderer.ctx.drawImage(renderer.background, 0, 0);
        else {
          renderer.ctx.fillStyle = '#203033';
          renderer.ctx.fillRect(0, 0, stage.width, stage.height);
        }
        renderer.summonVisuals = { v2, aura: options.aura, marks: options.marks, previewTime: 0 };
        renderer.drawSummonSprite({
          creatureId: id, element: fusion, hp: 20, maxHp: 20, isGrand: options.size === 'Grand',
        }, 88, 147, 0, null, 0);
        ctx.drawImage(stage, sampleLeft, sampleTop, sampleWidth, sampleHeight,
          column * sampleWidth, 0, sampleWidth, sampleHeight);
      }
      pair.append(labels, canvas);
      viewport.append(pair);
      if (options.zoom > 1) {
        viewport.tabIndex = 0;
        viewport.setAttribute('aria-label', 'Scrollable enlarged preview');
      }
      figure.append(viewport);
      return figure;
    }

    function render() {
      const view = controls.view.value;
      const selected = view === 'matrix' ? species : view === 'priority' ? priority : [controls.species.value];
      const options = {
        zoom: Number(controls.zoom.value),
        size: controls.size.value,
        aura: controls.aura.checked,
        marks: controls.marks.checked,
        battlefield: controls.battlefield.checked,
      };
      controls.species.disabled = view !== 'single';
      comparisons.classList.toggle('single', view === 'single');
      comparisons.style.setProperty('--pair-width', `${pairWidth * options.zoom}px`);
      comparisons.style.setProperty('--card-width', `${pairWidth * options.zoom + 28}px`);
      const cards = palettes.map(([id, palette]) => {
        const card = element('article');
        card.style.setProperty('--element', palette.highlight);
        const heading = element('div', null, 'palette');
        heading.append(element('h2', title(id)), swatches(palette));
        const samples = element('div', null, 'samples');
        for (const creature of selected) samples.append(sample(creature, id, options));
        card.append(heading, samples);
        return card;
      });
      comparisons.replaceChildren(...cards);
      status.textContent = `${selected.length * palettes.length} comparisons · ${selected.length} species · ${palettes.length} elements`;
    }

    form.addEventListener('change', render);
    form.addEventListener('submit', event => event.preventDefault());
    render();
    // Use the renderer's real backdrop when it finishes loading.
    window.addEventListener('load', () => { if (controls.battlefield.checked) render(); }, { once: true });
  </script>
</body>
</html>
