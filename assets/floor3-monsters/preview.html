<!doctype html><html lang="th"><meta charset="utf-8"><title>ตัวอย่างมอนชั้น 3</title>
<style>body{background:#171222;color:#f5e7ce;font:16px sans-serif}canvas{width:min(960px,100%);height:auto;image-rendering:pixelated}button{padding:10px;margin:4px}</style>
<h1>ตัวอย่างมอนชั้น 3</h1><p>ภาพตัวอย่างใช้ตัววาดเดียวกับสนามเกม</p>
<canvas id="battle-canvas" width="320" height="180" aria-label="มอนชั้น 3"></canvas><br>
<button id="group">ศัตรูทั่วไป</button><button id="boss">บอสตำรา</button><button id="attack">ท่าโจมตี</button>
<script type="module">
import { Battlefield } from '../../src/render.js';
import { createRun, createEnemy } from '../../src/run.js';
const canvas=document.querySelector('canvas'), state=createRun('floor3-preview');
const field=new Battlefield(canvas,{reducedMotion:false});
function group(){field.stop();state.enemies=['armored','warden','support'].map(createEnemy);state.turn=1;field.set(state,null)}
function boss(){field.stop();state.enemies=[createEnemy('boss',0)];state.turn=1;field.set(state,null)}
document.querySelector('#group').onclick=group; document.querySelector('#boss').onclick=boss;
document.querySelector('#attack').onclick=()=>field.animate(state.enemies.map(e=>({type:'attack',source:e.id,amount:3})),()=>{},()=>field.stop());
group();
</script></html>
